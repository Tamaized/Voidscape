import net.neoforged.moddevgradle.internal.IntelliJOutputDirectoryValueSource

plugins {
	id 'java-library'
	id 'idea'
}

repositories {
	maven { url = 'https://maven.neoforged.net/releases' }
	maven {
		name 'Mojang'
		url 'https://libraries.minecraft.net'
	}
	mavenCentral()
	maven {
		name 'Tama\'s Maven'
		url 'https://maven.tamaized.com/releases/'
	}
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(25))
	}
}

compileJava.options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-this-escape" << "-Werror"

sourceSets {
	main {
		java {
			srcDirs = ['../src/asm/java']
		}
		resources {
			srcDirs = ['../src/asm/resources']
		}
	}
}

dependencies {
	compileOnly "org.jetbrains:annotations:24.0.1"
	// Version List: https://projects.neoforged.net/neoforged/fancymodloader
	compileOnly "net.neoforged.fancymodloader:loader:11.0.13"

	// This is for javadoc, please do not actually classload anything from the main source set!!!!!!
	def jankAssShit = IntelliJOutputDirectoryValueSource.getIntellijOutputDirectory(rootProject)
	if (jankAssShit != null) {
		jankAssShit = jankAssShit.apply(rootProject).toPath().resolve('production')
		compileOnly files(jankAssShit.resolve('classes'), jankAssShit.resolve('resources'))
	}
}

jar {
	manifest {
		attributes(
			'FMLModType': "LIBRARY",
			'Specification-Title': "voidscape-asm",
			'Specification-Vendor': "Tamaized",
			'Specification-Version': "1",
			'Implementation-Title': project.name,
			'Implementation-Version': project.jar.archiveVersion,
			'Implementation-Vendor': "Tamaized",
			'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		)
	}
}